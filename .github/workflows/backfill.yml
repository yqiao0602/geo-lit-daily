name: backfill

on:
  workflow_dispatch:
    inputs:
      since:
        description: '回溯起始年份（如 2024）'
        required: false
        default: '2024'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install -r requirements.txt

      - name: 存量回溯扫描
        env:
          LIT_LLM_API_KEY: ${{ secrets.LIT_LLM_API_KEY }}
          LIT_LLM_BASE_URL: ${{ secrets.LIT_LLM_BASE_URL }}
          LIT_LLM_MODEL: ${{ secrets.LIT_LLM_MODEL }}
        run: python main.py --backfill ${{ inputs.since }}

      - name: 归档 backlog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backlog.md
          git commit -m "backlog: since ${{ inputs.since }}" || echo "nothing to commit"
          git push
