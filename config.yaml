# geo-lit-daily 配置
# 注意：敏感信息（API key、SMTP 密码、Server酱 key）一律不写在这里，
#       通过环境变量 / GitHub Secrets 注入（见 README.md）。

mailto: lit-daily@example.com   # 建议改成自己邮箱，进 OpenAlex polite pool

# 收录控制
min_score: 5        # LLM 相关性阈值（0-10）
max_papers: 15      # 日报最多收录篇数
hot_score: 8        # ≥此分数视为"强相关"：卡片高亮 + 重视提示 + 邮件标题加 🔥

# ---- 数据源 1：arXiv 预印本 ----
arxiv:
  window_days: 2    # 抓最近 2 天提交的论文（跨周末不漏）
  max_results: 600
  categories: [cs.AI, cs.CL, cs.LG, cs.SE]

# ---- 数据源 2：OpenAlex 期刊 + 作者 + 关键词检索 ----
openalex:
  window_days: 5    # 期刊索引有滞后，窗口放宽，靠 state.json 去重
  journals:         # 期刊新文（source id 已核验）
    - {id: S111872859,  name: IJGIS}
    - {id: S859791518,  name: Transactions in GIS}
    - {id: S2764431341, name: ISPRS IJGI}
    - {id: S4210179989, name: Int J Appl Earth Obs (JAG)}
    - {id: S61699894,   name: Computers & Geosciences}
    - {id: S113611870,  name: Env Modelling & Software}
    - {id: S198914822,  name: Earth Science Informatics}
    - {id: S4210168194, name: GeoInformatica}
    - {id: S4210199948, name: Annals of GIS}
    - {id: S36798160,   name: Geo-spatial Information Science}
    - {id: S60115552,   name: CEUS}
    - {id: S189706386,  name: CaGIS}
  authors:          # 作者新文（id 已通过 ORCID/已知论文双重核验）
    - {id: A5110860664, name: 侯舒扬 Hou Shuyang}
    - {id: A5135579908, name: Hou Shuyang(碎片)}
    - {id: A5110930512, name: Krzysztof Janowicz}
    - {id: A5103035722, name: Krzysztof Janowicz(碎片)}
    - {id: A5005042481, name: Yingjie Hu}
    - {id: A5036007312, name: Gengchen Mai}
    - {id: A5101938899, name: Song Gao}
    - {id: A5100338179, name: Wenwen Li}
    - {id: A5073915674, name: Zhenlong Li}
    - {id: A5067070198, name: Grant McKenzie}
    - {id: A5077311323,  name: Bo Yan}
    - {id: A5082809671,  name: Rui Zhu}
  search_queries:   # 全库关键词检索（兜底：会议论文/不在上述期刊的文献）
    - "geospatial code generation"
    - "GIS large language model"
    - "geoprocessing workflow"
    - "GIS agent"
    - "geographic question answering"
    - "spatially explicit machine learning"
    - "geospatial tool"
    - "QGIS"
    - "workflow reasoning"
    - "task decomposition language model"

# ---- 关键词粗筛（省 LLM token 的第一道闸）----
# 通道（按优先级）：
#   ① strong 任一命中 → 收
#   ② workflow_terms ∧ toolcode_terms → 收（工作流/工具推理通道，不要求 GIS 词汇）
#   ③ transfer_terms ∧ llm_gate_terms → 收（能力迁移通道，不要求 GIS 词汇）
#   ④ rl_terms ∧ method_target_terms → 收（RL 仅当绑定代码/工具/工作流场景）
#   ⑤ domain_terms ∧ task_terms → 收
#   ⑥ 作者跟踪 → 绕过一切直收
# 注意：GEE/Earth Engine/QGIS 是平台语境词（在 domain_terms），不再是强命中词——
#       "用 GEE 做土地覆盖分类"类应用论文应被挡在闸外
filter:
  domain_terms: [geospatial, gis, qgis, arcgis, arcpy, google earth engine, earth engine,
                 remote sensing, earth observation, geographic, geography, spatial data,
                 spatially explicit, geo-, geoprocess, mapping, cartograph, land cover,
                 land use, satellite, lidar, terrain, earth science, geoai]
  task_terms: [code generation, code synthesis, program synthesis, workflow, operator,
               toolchain, tool use, tool sequence, tool call, function call, agent, llm,
               language model, foundation model, fine-tun, instruction tun, prompt,
               model builder, knowledge graph, ontology, chain-of-thought,
               retrieval-augmented, rag, copilot, chatbot, hallucinat, natural language,
               text-to-, automation, script, geo-question, question answering,
               lora, qlora, peft, parameter-efficient, structured output,
               constrained decoding, self-correct, self-refine, self-debug,
               task decomposition, structured prediction, dependency prediction,
               multi-step planning, multi-step reasoning, workflow reasoning,
               tool selection, tool grounding, process planning, structured generation,
               graph generation, iterative refinement, error recovery]
  strong_terms: [geospatial code, gis copilot, geospatial agent, gis agent, geoagent,
                 nl2gis, gis large language, geospatial tool, gis tool,
                 geoprocessing workflow, spatial workflow, geoai,
                 workflow reasoning, geographic question]
  rl_terms: [reinforcement learning, rlhf, grpo, dpo, ppo, preference optimization,
             preference learning, reward model, process reward, verifiable reward,
             reinforcement fine-tuning, policy optimization, self-play]
  method_target_terms: [code generation, program synthesis, tool use, tool calling,
                        tool call, agent, workflow, structured output,
                        constrained decoding, planning]
  workflow_terms: [workflow, workflow planning, workflow generation, workflow reasoning,
                   task decomposition, process planning, multi-step planning,
                   multi-step reasoning, procedural reasoning]
  toolcode_terms: [tool use, tool selection, tool calling, tool grounding, tool learning,
                   tool call, function call, api call, code generation, program synthesis,
                   structured generation, graph generation, operator selection]
  transfer_terms: [cross-domain transfer, knowledge transfer, capability transfer,
                   task transfer, cross-task transfer, cross-domain generalization,
                   domain generalization, domain adaptation, task adaptation,
                   knowledge adaptation, transfer learning, continued pretraining,
                   continual pretraining, continual learning, multi-stage training,
                   intermediate pretraining, intermediate fine-tuning,
                   sequential fine-tuning, transfer, knowledge distillation,
                   task distillation, behavior distillation, representation transfer,
                   zero-shot transfer, few-shot transfer, cross-platform, cross-tool,
                   tool transfer, platform transfer]
  llm_gate_terms: [llm, large language model, language model, foundation model,
                   instruction-tun, gpt, llama, qwen]

# ---- LLM（OpenAI 兼容协议；密钥走环境变量 LIT_LLM_API_KEY）----
llm:
  base_url: https://api.deepseek.com   # 环境变量 LIT_LLM_BASE_URL 可覆盖（带不带 /v1 均可）
  model: deepseek-flash                # 2026-09 DeepSeek 在售模型：deepseek-flash (V4.1)

# ---- 邮件（密钥走环境变量；此处只放非敏感默认值）----
email:
  host: smtp.qq.com     # 环境变量 LIT_SMTP_HOST 覆盖；QQ邮箱 smtp.qq.com:465
  port: 465             # 465=SSL；587=STARTTLS

# ---- 存量回溯（手动一次性任务：python main.py --backfill 2024）----
backfill:
  max_llm: 400          # LLM 打分调用上限；超出时作者跟踪优先，其余截断

# ---- 研究画像（注入 LLM prompt，决定打分和"与课题的联系"）----
profile: |
  核心科学问题（Route-2）：一个模型在 GEE workflow 上学到的 GIS 工作流推理能力
  （Workflow Reasoning：任务分解、步骤规划、依赖组织），能否在不依赖显式 L3
  语义中间层的情况下，迁移到 QGIS operator grounding，最终生成结构正确、
  依赖闭合、可执行的 QGIS processes + links 图结构。
  研究管线：GIS Task → Workflow Reasoning → 模型内部可迁移的工作流知识 →
  能力/知识迁移 → QGIS Grounding → 结构化 QGIS 图生成。
  七个可支撑环节：①GIS Task→Workflow ②Workflow→结构化表示 ③能力迁移
  （跨域/跨平台/跨工具：GEE→QGIS、tool→tool、NL→API、源域→目标域）
  ④Workflow→QGIS Operator 落地 ⑤结构化 QGIS 图生成 ⑥训练/后训练
  ⑦评测。
  DAPT/SFT/LoRA/蒸馏/持续学习/偏好与 RL 是实现手段而非研究主轴；RL 为储备池，
  仅当绑定 tool/code/workflow/GIS 场景时才算高相关，纯 RL 算法改进不算。
  平台（GEE/QGIS/遥感）是实验语境词：用 GEE/QGIS 做土地覆盖、生态监测、城市
  分析等应用的论文不是我们要的；我们要的是"工作流推理/工具落地/能力迁移/
  结构化生成"本身——即使论文完全没有 GIS 词汇，只要它在 LLM/基础模型上研究
  这些能力，就高度相关。
  评测关注：工作流推理质量、迁移保持率（transfer retention）、QGIS 落地可用率、
  幻觉算子率、执行成功率。
